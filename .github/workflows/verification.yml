name: Verification

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-contract:
    name: Wrapper contract (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax verification
        run: npm run check:syntax
      - name: Wrapper baseline plus fixed lifecycle regressions
        run: npm test
      - name: Verify S7 wire harness deadline owns its polling task
        run: node --test test/integration/wait-for-status.test.cjs

  pinned-nodes7-integration:
    name: Pinned nodes7 integration (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install immutable SHA512-pinned corrected nodes7
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual installed fork, early Node-RED close and parsed late COTP CC
        run: npm run test:integration
      - name: Save real TCP observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-nodes7-integration-${{ matrix.os }}-node22
          path: test-reports/nodes7-pinned-*.json
          retention-days: 14
          if-no-files-found: warn

  static-quality:
    name: Static quality (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/quality/package-lock.json
      - name: Install standalone pinned static-quality dependencies
        run: npm ci --prefix tools/quality --ignore-scripts --no-audit --no-fund
      - name: Print exact Prettier output for new security verifier (diagnostic only)
        run: node tools/quality/node_modules/prettier/bin/prettier.cjs tools/quality/verify-security-maintenance.cjs
      - name: ESLint correctness checks, including CJS wire integration
        run: npm run lint
      - name: Prettier on new and preformatted changed files
        run: npm run format:check
      - name: Real ESLint/Prettier failing and passing controls
        run: npm run quality:negative-control
      - name: Validate Dependabot YAML syntax, independent scopes and policy
        run: node tools/quality/verify-security-maintenance.cjs

  js-types-diagnostics:
    name: JavaScript type diagnostics (advisory, Ubuntu Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated quality tools
        run: npm ci --prefix tools/quality --ignore-scripts --no-audit --no-fund
      - name: Capture inherited JavaScript typing debt without claiming type-safety
        shell: bash
        run: |
          mkdir -p test-reports
          node tools/quality/node_modules/typescript/bin/tsc --project tools/quality/tsconfig.json --pretty false > test-reports/js-type-diagnostics.txt 2>&1 || {
            echo '::warning::Legacy JS type diagnostics remain open and are advisory'
            cat test-reports/js-type-diagnostics.txt
          }
      - name: Archive diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-type-diagnostics-ubuntu-node22
          path: test-reports/js-type-diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

  package-smoke:
    # This job name is already required by protect-master.
    # Make BOTH hosted S7 wire tests mandatory without relying on adding
    # unprotected status checks to the ruleset before this PR is merged.
    needs: [wire-protocol, pinned-nodes7-integration, static-quality]
    if: ${{ always() }}
    name: Package dependency smoke (Ubuntu, Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require real wire and actual pinned fork integration on both hosts
        env:
          S7_WIRE_RESULT: ${{ needs.wire-protocol.result }}
          FORK_RESULT: ${{ needs.pinned-nodes7-integration.result }}
          QUALITY_RESULT: ${{ needs.static-quality.result }}
        run: |
          node -e "for (const [kind,state] of [['S7 wire',process.env.S7_WIRE_RESULT],['Pinned fork',process.env.FORK_RESULT],['Static quality',process.env.QUALITY_RESULT]]) if(state!=='success') throw Error(kind+' matrix failed: '+state)"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact locked dependencies without executing dependency scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate exact registry dependency tree
        run: |
          npm ls --all
          node -e "if(typeof require('@st-one-io/nodes7').S7Endpoint!=='function')throw new Error('nodes7 S7Endpoint unavailable')"
      - name: Verify Node-RED runtime files and exclude CI toolchain from package
        shell: bash
        run: |
          npm pack --dry-run --json > package-composition.json
          node tools/quality/check-package-files.cjs package-composition.json

  baseline-negative-control:
    # Preserve the name required by protect-master. Its meaning is now BOTH
    # expected-red on the immutable original revision AND green on this code.
    name: Baseline must fail stale-read regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The original read-only baseline commit is an ancestor of master.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original fails and patched wrapper passes all lifecycle cases
        shell: bash
        run: |
          set -euo pipefail
          # Known first-parent baseline, merged as PR #6 with no runtime edits.
          baseline_sha="e79c15107731e0387d1b3679f2409aef043e87f5"
          mkdir -p test-reports
          git show "${baseline_sha}:red/s7.js" > test-reports/original-s7.js
          patterns=(
            "late successful read cannot resurrect disconnected status"
            "late failure from an obsolete read must not mark a reconnected endpoint offline"
            "a reconnect must not overlap a pending read on the same item group"
            "late successful read must not publish obsolete data after disconnect"
            "closing an endpoint cancels its polling timer during a pending read"
            "stale success after reconnect cannot publish old data or delay a fresh read"
            "close reports completion even when transport disconnect rejects"
            "disabled polling remains disabled across a disconnect and reconnect"
            "closed endpoint ignores a late connect and a pending read result"
            "transport error discards old read but allows a subsequent polling retry"
          )
          index=0
          for pattern in "${patterns[@]}"; do
            index=$((index + 1))
            negative="test-reports/baseline-${index}.tap"
            positive="test-reports/fixed-${index}.tap"
            set +e
            S7_TEST_SOURCE="$PWD/test-reports/original-s7.js" node --test --test-name-pattern="$pattern" test/regression/s7-endpoint.lifecycle.test.js > "$negative" 2>&1
            baseline_code=$?
            set -e
            if [ "$baseline_code" -eq 0 ] ||
               ! grep -Fq "not ok 1 - $pattern" "$negative" ||
               ! grep -Fq '# fail 1' "$negative" ||
               ! grep -Fq 'AssertionError' "$negative"; then
              cat "$negative"
              echo "::error::Original baseline must fail ONLY the named assertion: $pattern"
              exit 1
            fi
            S7_TEST_SOURCE="$PWD/red/s7.js" node --test --test-name-pattern="$pattern" test/regression/s7-endpoint.lifecycle.test.js > "$positive" 2>&1 || {
              cat "$positive"
              echo "::error::Patched lifecycle regression failed: $pattern"
              exit 1
            }
            if ! grep -Fq '# fail 0' "$positive" ||
               ! grep -Fq '# pass 1' "$positive"; then
              cat "$positive"
              echo "::error::Patched test did not run exactly once: $pattern"
              exit 1
            fi
            echo "::notice::Baseline-red / patch-green: $pattern"
          done
      - name: Preserve baseline-red and corrected-green test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-baseline-red-and-fixed-green-ubuntu-node22
          path: test-reports/*.tap
          if-no-files-found: warn
          retention-days: 14

  wire-protocol:
    name: S7 wire tests (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pure-Python fixture and actual nodes7 dependency
        run: |
          python -m pip install --disable-pip-version-check python-snap7==3.3.1
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Test actual S7Comm and partial COTP failure on loopback
        run: node --test test/protocol/*.test.js
      - name: Real Node-RED S7Comm DB1 synthetic read/write/readback against pinned fork
        run: node --test test/integration/nodes7-wrapper-s7comm-wire.test.cjs
      - name: Assert five real fault records and no orphan COTP peers
        run: node scripts/ci/verify-s7-wire-replay.cjs
      - name: Keep synthetic S7 protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s7-wire-loopback-${{ matrix.os }}-node22
          path: test-reports/s7-*
          if-no-files-found: warn
          retention-days: 14
