name: Independent common S7Comm Node-RED proof (no hardware)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-installed-pair:
    name: Installed JS vs Rust, one synthetic S7Comm fixture (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      S7_COMPARISON_DIR: /tmp/s7-common-compare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned synthetic PLC server, not Siemens hardware
        run: python -m pip install --disable-pip-version-check python-snap7==3.3.1
      - name: Check harness syntax and pack exact source-only Contrib alpha2
        shell: bash
        run: |
          set -euo pipefail
          node --check test/comparison/common-s7-read.cjs
          mkdir -p "$S7_COMPARISON_DIR/consumer"
          npm pack --ignore-scripts --json --pack-destination "$S7_COMPARISON_DIR" > "$S7_COMPARISON_DIR/pack.json"
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const path = require("node:path");
            const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (p.length !== 1 || p[0].name !== "@missel2/node-red-contrib-s7" || p[0].version !== "0.1.0-alpha.2") throw Error("Wrong JS package");
            const archive = path.join(process.argv[2], p[0].filename);
            const bytes = fs.readFileSync(archive);
            const hash = crypto.createHash("sha256").update(bytes).digest("hex");
            if (hash !== "316d6769431fffb805b07c825a5f474e875174843f4e8e6b6da9bffca02f2c24") throw Error("Source archive differs from approved master");
            const sri = "sha512-" + crypto.createHash("sha512").update(bytes).digest("base64");
            if (sri !== p[0].integrity) throw Error("Archive SRI mismatch");
            console.log("COMMON_S7_JS_ARCHIVE_SHA256=" + hash);
          ' "$S7_COMPARISON_DIR/pack.json" "$S7_COMPARISON_DIR"
      - name: Install real Node-RED 5.0.9 and BOTH published/native S7 package identities
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"name":"s7-comparison-disposable","version":"0.0.0","private":true}' > "$S7_COMPARISON_DIR/consumer/package.json"
          npm install --prefix "$S7_COMPARISON_DIR/consumer" --ignore-scripts --no-audit --no-fund --save-exact \
            node-red@5.0.9 \
            node-red-node-test-helper@0.3.6 \
            node-red-contrib-s7-rust@1.4.0 \
            "$S7_COMPARISON_DIR/missel2-node-red-contrib-s7-0.1.0-alpha.2.tgz"
          node -e '
            const fs=require("node:fs"),crypto=require("node:crypto");
            const p=process.argv[1]+"/package-lock.json";
            console.log("COMMON_S7_CONSUMER_LOCK_SHA256="+crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"));
          ' "$S7_COMPARISON_DIR/consumer"
      - name: Run identical classic S7Comm DB1 read and flow-removal teardown
        run: node test/comparison/common-s7-read.cjs "$S7_COMPARISON_DIR/consumer"
        timeout-minutes: 5
      - name: Validate historical issue provenance and no fake test passes
        run: node scripts/ci/validate-s7-historical-issue-index.cjs
      - name: Compare historical multi-write, odd PDU and overlapping read regressions
        run: node test/comparison/historical-s7-regressions.cjs "$S7_COMPARISON_DIR/consumer"
        timeout-minutes: 7
      - name: Preserve historical cross-engine evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s7-historical-cross-engine
          path: test-reports/s7-historical-cross-engine.json
          if-no-files-found: warn
          retention-days: 14
      - name: Malformed TPKT and COTP parser stability (isolated processes)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for engine in js rust; do
            for fault in short_tpkt non_tpkt declared_long_tpkt invalid_cotp_cc; do
              echo "::group::${engine}/${fault}: real installed Node-RED in isolated process"
              if timeout --signal=TERM --kill-after=3s 32s \
                env S7_MALFORMED_ENGINE="$engine" S7_MALFORMED_CASE="$fault" \
                node test/comparison/malformed-cotp.cjs "$S7_COMPARISON_DIR/consumer"; then
                echo "MALFORMED_CASE_PASSED=${engine}/${fault}"
              else
                result=$?
                echo "::error::Malformed handshake regression: $engine/$fault exit=$result"
                status=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$status"
        timeout-minutes: 7
      - name: Keep all real-process malformed response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s7-malformed-cotp-cross-engine
          path: test-reports/malformed-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Mutate READ_VAR replies from real Snap7 server (isolated parser fuzz cases)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for engine in js rust; do
            for fault in error_items_nonzero_length short_s7_reply inconsistent_data_length wrong_pdu_reference; do
              echo "::group::${engine}/${fault}: live READ_VAR reply mutation"
              if timeout --signal=TERM --kill-after=3s 36s \
                env S7_READ_FAULT_ENGINE="$engine" S7_READ_FAULT_CASE="$fault" \
                node test/comparison/malformed-read.cjs "$S7_COMPARISON_DIR/consumer"; then
                echo "MALFORMED_READ_CASE_PASSED=${engine}/${fault}"
              else
                result=$?
                echo "::error::Live READ_VAR mutation regression: $engine/$fault exit=$result"
                status=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$status"
        timeout-minutes: 8
      - name: Preserve independent READ_VAR mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s7-malformed-read-cross-engine
          path: test-reports/malformed-read-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Keep neutral protocol proof regardless of test outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-s7-js-vs-rust-loopback
          path: test-reports/common-s7-compare.json
          if-no-files-found: warn
          retention-days: 14

  rust-regression-parity:
    name: Rust 1.4.0 fault-parity (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scenario: [full, blackhole_only]
    env:
      S7_RUST_PARITY_DIR: /tmp/s7-rust-ci-parity
      S7_RUST_PARITY_CASE: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned external classic S7Comm loopback fixture
        run: python -m pip install --disable-pip-version-check python-snap7==3.3.1
      - name: Install unmodified Node-RED and real released Rust addon
        shell: bash
        run: |
          set -euo pipefail
          node --check test/comparison/rust-ci-parity.cjs
          mkdir -p "$S7_RUST_PARITY_DIR"
          printf '%s\n' '{"name":"s7-rust-parity-consumer","version":"0.0.0","private":true}' > "$S7_RUST_PARITY_DIR/package.json"
          npm install --prefix "$S7_RUST_PARITY_DIR" --ignore-scripts --no-audit --no-fund --save-exact \
            node-red@5.0.9 node-red-node-test-helper@0.3.6 node-red-contrib-s7-rust@1.4.0
          node -e '
            const fs=require("node:fs"),crypto=require("node:crypto");
            const p=process.argv[1]+"/package-lock.json";
            console.log("RUST_PARITY_CONSUMER_LOCK_SHA256="+crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex"));
          ' "$S7_RUST_PARITY_DIR"
      - name: Run Rust against existing S7Comm proxy-fault semantics
        run: node test/comparison/rust-ci-parity.cjs "$S7_RUST_PARITY_DIR"
        timeout-minutes: 7
      - name: Retain machine-readable fault evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-s7-ci-parity-${{ matrix.scenario }}
          path: test-reports/rust-s7-ci-parity.json
          if-no-files-found: warn
          retention-days: 14

  temporary-source-format:
    name: Temporary exact Prettier snapshot for new protocol corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --prefix tools/quality --ignore-scripts --no-audit --no-fund
      - name: Format test and relay, print exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          node tools/quality/node_modules/prettier/bin/prettier.cjs --write test/comparison/malformed-cotp.cjs test/comparison/malformed-read.cjs test/runtime-lab/wire-peer.cjs scripts/ci/validate-s7-historical-issue-index.cjs docs/s7-regression-contracts.json
          node -e 'const fs=require("node:fs"); for(const [k,p] of [["COTP","test/comparison/malformed-cotp.cjs"],["READ","test/comparison/malformed-read.cjs"],["PROXY","test/runtime-lab/wire-peer.cjs"]]) console.log("PROTOCOL_FORMAT_"+k+"_B64="+fs.readFileSync(p).toString("base64"))'
          node -e 'const fs=require("node:fs");for(const [k,p] of [["CONTRACTS","docs/s7-regression-contracts.json"],["VALIDATOR","scripts/ci/validate-s7-historical-issue-index.cjs"]])console.log("PROTOCOL_FORMAT_"+k+"_B64="+fs.readFileSync(p).toString("base64"))'

  released-rust-addon-platforms:
    name: Published Rust native addon on glibc and musl (no PLC)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Load release addon from npm under Node 22/glibc and Node 24/musl
        shell: bash
        run: |
          set -euo pipefail
          for image in node:22-bookworm-slim node:24-alpine; do
            echo "::group::Native NAPI release smoke: $image"
            docker pull "$image"
            docker image inspect --format='IMAGE_DIGEST={{index .RepoDigests 0}}' "$image"
            docker run --rm --entrypoint sh "$image" -ec '
              set -eu
              mkdir -p /tmp/s7-native-release
              cd /tmp/s7-native-release
              printf "%s\n" "{\"name\":\"disposable-native-check\",\"version\":\"0.0.0\",\"private\":true}" > package.json
              npm install --ignore-scripts --no-audit --no-fund --save-exact node-red-contrib-s7-rust@1.4.0
              node -e "
                const p=require(\"node-red-contrib-s7-rust/package.json\");
                if(p.version!==\"1.4.0\") throw Error(\"Unexpected Rust package version\");
                if(process.env.S7RS_NAPI) throw Error(\"Unexpected external test addon\");
                const bridge=require(\"node-red-contrib-s7-rust/lib/napi-bridge\");
                const binary=bridge.addonPath();
                const addon=bridge.loadAddon();
                if(typeof addon.S7Native!==\"function\") throw Error(\"Native S7Native export missing\");
                console.log(\"RELEASE_NAPI_OK=\"+process.platform+\"/\"+process.arch+\" \"+process.version);
                console.log(\"RELEASE_NAPI_BINARY=\"+binary.replace(process.cwd(),\"<consumer>\"));
              "
            '
            echo "::endgroup::"
          done
