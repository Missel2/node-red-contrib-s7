name: NPM lockfile reproducibility

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-lockfile.yml
  push:
    branches: [master]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-lockfile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-lockfile:
    name: NPM lockfile (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and verify published npm alias integrity metadata
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json');const l=require('./package-lock.json');const spec=p.dependencies['@st-one-io/nodes7'];const dep=l.packages?.['node_modules/@st-one-io/nodes7'];const url='https://registry.npmjs.org/@missel2/nodes7/-/nodes7-0.1.0-alpha.1.tgz';const sri='sha512-07lzsDrfxQ5P15iM/+rjxNVbo0gyIGWjKivXfgU/tEUQs1qO+A0upy6690qy85mG7mEiNpek1xqhRVASvb9ktw==';if(l.lockfileVersion!==3||l.version!==p.version||spec!=='npm:@missel2/nodes7@0.1.0-alpha.1'||l.packages?.['']?.dependencies?.['@st-one-io/nodes7']!==spec||dep?.name!=='@missel2/nodes7'||dep?.version!=='0.1.0-alpha.1'||dep?.resolved!==url||dep?.integrity!==sri||l.packages?.['node_modules/iso-on-tcp']?.version!=='0.1.0')throw new Error('Published nodes7 alpha registry alias or pinned integrity mismatch')"
      - name: Clean dependency installation without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all
          node -e "if(typeof require('@st-one-io/nodes7').S7Endpoint!=='function')throw new Error('nodes7 missing S7Endpoint')"
      - name: Package composition smoke
        run: npm pack --dry-run --json > package-composition.json
      - name: Registry security advisory inventory (informational, triage required)
        continue-on-error: true
        run: npm audit --omit=dev --json > npm-audit.json
      - name: Lockfile must be committed exactly as npm resolves it
        run: git diff --exit-code -- package-lock.json
      - name: Preserve registry lockfile and audited evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-${{ matrix.os }}-node22
          path: |
            package-lock.json
            package-composition.json
            npm-audit.json
          if-no-files-found: warn
          retention-days: 14
