name: Published alpha consumer proof (no publish)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# GitHub-hosted, public npm registry reads only. No token, OIDC, deployment or PLC.
permissions:
  contents: read

jobs:
  public-consumer:
    name: Public npm consumer (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Negative controls (offline fixtures)
        run: node --test test/release/published-consumer.test.cjs
      - name: Verify npm release bytes and disposable installed consumer
        run: node scripts/release/verify-published-consumer.cjs
      - name: Preserve non-identifying release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-public-consumer-${{ matrix.os }}
          path: test-reports/public-npm-consumer.json
          if-no-files-found: warn
          retention-days: 7

  nodes7-alpha2-registry:
    name: Published nodes7 alpha2 artifact (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove registry hash and tag negative controls offline
        run: node --test test/release/nodes7-alpha2-registry.test.cjs
      - name: Independently verify published nodes7 alpha2 registry and tarball bytes
        run: node scripts/release/verify-nodes7-alpha2-registry.cjs
      - name: Preserve public metadata and SHA evidence only (no package)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nodes7-alpha2-public-registry-${{ matrix.os }}
          path: test-reports/nodes7-alpha2-registry-*.json
          if-no-files-found: warn
          retention-days: 14
