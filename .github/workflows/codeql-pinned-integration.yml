name: CodeQL pinned S7 integration

on:
  pull_request:
    paths:
      - 'test/integration/**'
      - 'scripts/ci/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verification.yml'
      - '.github/workflows/codeql-pinned-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pinned-s7-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze pinned S7 integration (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          upload-database: 'false'
          output: codeql-results
      - name: Fail on high or critical local SARIF security findings
        run: node scripts/ci/check-local-codeql-sarif.cjs codeql-results
      - name: Preserve analysis evidence without uploading to Default Setup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-s7-local-codeql-sarif
          path: |
            codeql-results/
            test-reports/pinned-codeql-summary.json
          if-no-files-found: warn
          retention-days: 14
