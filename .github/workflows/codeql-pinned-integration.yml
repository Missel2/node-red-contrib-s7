name: CodeQL pinned S7 integration

on:
  pull_request:
    paths:
      - 'test/integration/**'
      - 'scripts/ci/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verification.yml'
      - '.github/workflows/codeql-pinned-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: pinned-s7-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze pinned S7 integration (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
