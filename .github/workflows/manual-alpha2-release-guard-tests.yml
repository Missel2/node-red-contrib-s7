name: Manual alpha2 release guard tests (no publish)

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  negative-controls:
    name: Manual alpha2 admission negative controls (Ubuntu, Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Read-only release guard and archive regression tests
        run: |
          node --test test/release/manual-alpha2-release-guard.test.cjs test/release/alpha2-archive.test.cjs test/release/manual-alpha2-publish-archive.test.cjs
          node --check scripts/release/manual-alpha2-release-guard.cjs
          node --check scripts/release/check-alpha2-publish-archive.cjs
