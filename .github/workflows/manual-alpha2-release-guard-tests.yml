name: Manual alpha2 release guard tests (no publish)

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  negative-controls:
    name: Manual alpha2 admission negative controls (Ubuntu, Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Read-only release guard and archive regression tests
        run: |
          node --test test/release/manual-alpha2-release-guard.test.cjs test/release/alpha2-archive.test.cjs test/release/manual-alpha2-publish-archive.test.cjs
          node --check scripts/release/manual-alpha2-release-guard.cjs
          node --check scripts/release/check-alpha2-publish-archive.cjs

  format-snapshot:
    name: Temporary Prettier 3.6.2 formatting snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: npm ci --prefix tools/quality --ignore-scripts --no-audit --no-fund
      - name: Print exact formatted public-source payloads
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/release/check-alpha2-publish-archive.cjs
            scripts/release/manual-alpha2-release-guard.cjs
            test/release/manual-alpha2-publish-archive.test.cjs
            test/release/manual-alpha2-release-guard.test.cjs
          )
          node tools/quality/node_modules/prettier/bin/prettier.cjs --write "${files[@]}"
          node -e 'const fs=require("node:fs");for(const f of process.argv.slice(1))console.log("FORMATTED_B64|"+f+"|"+fs.readFileSync(f).toString("base64"))' "${files[@]}"
