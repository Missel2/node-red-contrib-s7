# Downstream fork: dependency update PRs require protected CI and human review.
# The exact SHA512-locked nodes7 codeload commit is NOT automatically certified
# or automatically upgraded by routine registry version-update PRs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      routine-runtime-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Isolated private CI tooling from merged PR #14. Do not mix with runtime.
  - package-ecosystem: "npm"
    directory: "/tools/quality"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      routine-ci-quality-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      routine-github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
